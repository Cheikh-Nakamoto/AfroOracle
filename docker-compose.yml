services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      # Empty = mock AI path (demo without Meta key). Set in .env for real calls.
      META_API_KEY: ${META_API_KEY:-}
      POLYGON_RPC: ${POLYGON_RPC:-}
      PRIVATE_KEY: ${PRIVATE_KEY:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/state"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-side URL of the backend (page.tsx is a client component).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
